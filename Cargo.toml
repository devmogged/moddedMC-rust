[workspace]
resolver = "3"
# The server (engine/pumpkin) is its own workspace. Everything here talks to it only through the
# stable mod ABI in api/, so none of it has to match the server's build.
members = ["host", "api", "mods/*", "recompiler/fabric-host", "agent", "packer"]
exclude = ["engine"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
moddedmc-api = { path = "api" }

[profile.release]
lto = true
codegen-units = 1
strip = true

# The launcher is small, not hot.
[profile.release.package.moddedmc]
opt-level = "s"
