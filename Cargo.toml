[workspace]
resolver = "3"
# Native mods (mods/*) and the Fabric host (recompiler/fabric-host) are members of the server
# workspace (engine/pumpkin): a .dll plugin must come from the same build as the server.
members = ["host"]
exclude = ["engine"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
