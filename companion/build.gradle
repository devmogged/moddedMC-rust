plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup('com.geckolib') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    compileOnly "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    for (def module : ['fabric-api-base', 'fabric-networking-api-v1', 'fabric-creative-tab-api-v1', 'fabric-lifecycle-events-v1']) {
        def dependency = fabricApi.module(module, fabric_api_version)
        implementation dependency
        include dependency
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
