[package]
name = "moddedmc-app"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Desktop app: host servers on your machines and join friends' servers."

# Its own workspace: Tauri's dependencies stay out of the root workspace and its CI.
[workspace]

[lib]
name = "moddedmc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.25"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["process", "net", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.27"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
