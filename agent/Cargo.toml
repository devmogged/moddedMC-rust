[package]
name = "moddedmc-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs on every machine that hosts servers and lets the owner's app manage them (docs/DEVICES.md)."

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
fastcdc = "5.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal", "fs"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.14.4"
