[package]
name = "create"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Create kinetics for moddedMC, ported from Create 6.0.10 (Minecraft 1.21.1, NeoForge)."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
moddedmc-api.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastnbt = "2.6.3"
