[package]
name = "saints-dragons"
version = "0.1.1-preview.1"
edition.workspace = true
license = "MIT"
description = "Saint's Dragons for moddedMC, ported from Saint's Dragons 0.9.88 (Minecraft 1.20.1, Fabric and Forge), commit 13aeb2eb2c."
publish = false

[lib]
crate-type = ["cdylib"]

[features]
original-assets = []

[dependencies]
moddedmc-api.workspace = true
fastnbt = "2.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
