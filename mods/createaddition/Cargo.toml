[package]
name = "createaddition"
version = "0.1.0"
edition.workspace = true
license = "MIT"
description = "Create Crafts & Additions neoforge-1.21.1-1.7.2: energy/kinetics port in progress"
publish = false

# Passive electrum content ships in a .mmc. Kinetic machines remain unregistered.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
moddedmc-api.workspace = true
serde = { version = "1", features = ["derive"] }
fastnbt = "2.6.3"

[dev-dependencies]
serde_json = "1"
