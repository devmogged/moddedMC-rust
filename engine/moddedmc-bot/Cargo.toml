[package]
name = "moddedmc-bot"
version = "0.1.0"
description = "Headless Java client for moddedMC-rust scenario tests. Join/handshake code from Pumpkin's pumpkin-tester."
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
bytes.workspace = true
pumpkin-core.workspace = true
pumpkin-data.workspace = true
pumpkin-protocol.workspace = true
pumpkin-util.workspace = true
tokio = { workspace = true, features = ["full"] }
uuid.workspace = true
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha1 = { version = "=0.11.0", default-features = false, features = ["oid"] }

[lints]
workspace = true
