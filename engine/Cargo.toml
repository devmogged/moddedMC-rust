# The engine workspace: the content host, the test bot and the pack servers, built against our
# Pumpkin fork (engine/pumpkin, devmogged/Pumpkin branch moddedmc) through path dependencies.
#
# Two kinds of mods exist (see docs/MOD-ABI.md and docs/PORTS.md):
#   - drop-in mods (repo root workspace, `api/`): .mmc files loaded from mods/ at runtime.
#   - compiled-in ports (`ports/*`): Rust crates linked into a pack server here, with full
#     access to the engine. Big ports (Create, bosses, dragons) are this kind.
# Pack servers (`packs/*`) are the binaries: Pumpkin + the host + a set of compiled-in ports.
[workspace]
resolver = "3"
members = ["moddedmc-host", "moddedmc-bot", "packs/*"]  # add "ports/*" with the first port
exclude = ["pumpkin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[workspace.lints.clippy]
# Groups
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

if_then_some_else_none = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
separated_literal_suffix = "deny"
semicolon_outside_block = "deny"
redundant_test_prefix = "deny"
non_zero_suggestions = "deny"
dbg_macro = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
string_lit_chars_any = "deny"
use_self = "deny"
useless_let_if_seq = "deny"
branches_sharing_code = "deny"
equatable_if_let = "deny"
option_if_let_else = "deny"
needless_pass_by_ref_mut = "deny"
needless_collect = "deny"
redundant_clone = "deny"
set_contains_or_insert = "deny"
significant_drop_in_scrutinee = "deny"
print_stdout = "deny"
print_stderr = "deny"

todo = "deny"
unreachable = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Safety & Soundness
undocumented_unsafe_blocks = "deny"
uninit_assumed_init = "deny"
uninit_vec = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"

# Production Quality & Best Practices
fallible_impl_from = "deny"
mut_mut = "deny"
char_lit_as_u8 = "deny"
match_wild_err_arm = "deny"
invalid_upcast_comparisons = "deny"

# Expected/Allowed
clone_on_ref_ptr = "allow"

# Expected/Allowed
cargo_common_metadata = "allow"
cast_precision_loss = "allow"
multiple_crate_versions = "allow"
single_call_fn = "allow"
similar_names = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
suboptimal_flops = "allow"
cast_lossless = "allow"
while_float = "allow"
or_fun_call = "allow"
significant_drop_tightening = "allow"
suspicious_operation_groupings = "allow"
literal_string_with_formatting_args = "allow"
future_not_send = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
unused_async_trait_impl = "allow"
assert_is_empty = "allow"

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1

# The big library crates are mostly LLVM work before LTO. Fat LTO re-optimizes everything at the
# final link, so splitting their own codegen here only speeds up the build.
[profile.release.package.pumpkin-data]
codegen-units = 16

[profile.release.package.pumpkin-core]
codegen-units = 16

[profile.release.package.pumpkin-world]
codegen-units = 16

[profile.release.package.pumpkin-protocol]
codegen-units = 16

[profile.release.package.pumpkin-wasm-host]
codegen-units = 16

[profile.release.package.pumpkin-wasm-host-common]
codegen-units = 16

[profile.release.package.pumpkin-wasm-host-v0_1]
codegen-units = 16


[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.dev]
debug = false

# Day-to-day pack builds: optimized, but incremental and without fat LTO, so changing a port
# rebuilds in seconds to a minute instead of the release profile's ~17 minutes. Deploys to
# players use `release` (the app runs it in the background).
[profile.pack]
inherits = "release"
lto = false
codegen-units = 256
incremental = true

[workspace.dependencies]
pumpkin = { path = "pumpkin/crates/pumpkin" }
pumpkin-core = { path = "pumpkin/crates/pumpkin-core", default-features = false }
pumpkin-data = { path = "pumpkin/crates/pumpkin-data", default-features = false }
pumpkin-inventory = { path = "pumpkin/crates/pumpkin-inventory", default-features = false }
pumpkin-nbt = { path = "pumpkin/crates/pumpkin-nbt", default-features = false }
pumpkin-protocol = { path = "pumpkin/crates/pumpkin-protocol", default-features = false }
pumpkin-util = { path = "pumpkin/crates/pumpkin-util", default-features = false }
pumpkin-world = { path = "pumpkin/crates/pumpkin-world", default-features = false }

moddedmc-host = { path = "moddedmc-host" }
moddedmc-api = { path = "../api" }

# Versions match pumpkin/Cargo.toml.
tokio = { version = "1.54", default-features = false }
bytes = { version = "1.12", default-features = false, features = ["serde", "std"] }
uuid = { version = "1.29", default-features = false, features = ["serde", "v3", "v4", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
libloading = { version = "0.9", default-features = false, features = ["std"] }
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
