[package]
name = "moddedmc-host"
version = "0.1.0"
description = "moddedMC-rust content host: loads mods from mods/ through the stable mod ABI; registry, persistence and batched ticks."
edition.workspace = true
license = "GPL-3.0-only"
# Built as a member of the pinned Pumpkin workspace (see ../pumpkin/Cargo.toml).
workspace = "../pumpkin"

[dependencies]
pumpkin-core.workspace = true
pumpkin-data = { workspace = true, features = ["default"] }
pumpkin-inventory.workspace = true
pumpkin-nbt.workspace = true
pumpkin-util.workspace = true
moddedmc-api.workspace = true
pumpkin-protocol.workspace = true
pumpkin-world.workspace = true
tracing.workspace = true
libloading.workspace = true
zip.workspace = true
sha2.workspace = true
serde_json.workspace = true

[lints]
workspace = true
