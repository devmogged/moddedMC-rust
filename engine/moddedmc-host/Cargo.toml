[package]
name = "moddedmc-host"
version = "0.1.0"
description = "moddedMC-rust content host: registry, persistence and batched ticks for WASM content mods."
edition.workspace = true
license = "GPL-3.0-only"
# Built as a member of the pinned Pumpkin workspace (see ../pumpkin/Cargo.toml).
workspace = "../pumpkin"

[dependencies]
pumpkin-core.workspace = true
pumpkin-data = { workspace = true, features = ["default"] }
pumpkin-nbt.workspace = true
pumpkin-util.workspace = true
pumpkin-wasm-host-common.workspace = true
pumpkin-world.workspace = true
tracing.workspace = true
wasmtime.workspace = true

[lints]
workspace = true
