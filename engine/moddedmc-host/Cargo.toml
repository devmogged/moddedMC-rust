[package]
name = "moddedmc-host"
version = "0.1.0"
description = "moddedMC-rust content host: loads mods from mods/ through the stable mod ABI; registry, persistence and batched ticks."
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
pumpkin-core.workspace = true
pumpkin-config = { path = "../pumpkin/crates/pumpkin-config", default-features = false }
pumpkin-data = { workspace = true, features = ["default"] }
pumpkin-inventory.workspace = true
pumpkin-nbt.workspace = true
pumpkin-util.workspace = true
moddedmc-api.workspace = true
pumpkin-protocol.workspace = true
pumpkin-world.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt"] }
libloading.workspace = true
zip.workspace = true
sha2.workspace = true
sha1 = { version = "=0.11.0", default-features = false, features = ["oid"] }
bytes.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
uuid.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
