[package]
name = "moddedmc-pack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pack builder: turns a pack.toml into a pack server and its mods folder for each target."

[[bin]]
name = "moddedmc-pack"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.2.1"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
