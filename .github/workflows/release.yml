name: Release

# One tag (vX.Y.Z) publishes everything the desktop app installs and updates from:
#   - the app installer, signed for the updater, and latest.json (tauri-action),
#   - this PC's server files: moddedmc-server and moddedmc-agent, listed with checksums in
#     runtime.json (app/src-tauri/src/runtime.rs reads it from releases/latest).
# The engine build downloads Mojang's server.jar from Mojang itself (pumpkin-data/build.rs), the
# same way upstream Pumpkin builds; the jar is never stored or re-shared.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, like v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: |
            . -> target
            engine -> target
            app/src-tauri -> ../../target
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Use the tag as the app version
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $conf = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 app/src-tauri/tauri.conf.json

      - name: Build the server
        working-directory: engine
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --profile release -p pack-dev

      - name: Build the agent
        env:
          # Link the C runtime in, so a fresh Windows without the VC++ redistributable runs them.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p moddedmc-agent

      - name: Build the app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          releaseName: moddedMC ${{ env.TAG }}
          releaseBody: Run the moddedMC setup .exe below. The app downloads the server files on first launch and keeps everything up to date.
          releaseDraft: false
          uploadUpdaterJson: true

      - name: Publish the server files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item engine/target/release/pack-dev.exe out/moddedmc-server-windows-x86_64.exe
          Copy-Item target/release/moddedmc-agent.exe out/moddedmc-agent-windows-x86_64.exe
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:TAG"
          $files = foreach ($role in 'server', 'agent') {
            $path = "out/moddedmc-$role-windows-x86_64.exe"
            [ordered]@{
              role   = $role
              target = 'windows-x86_64'
              url    = "$base/moddedmc-$role-windows-x86_64.exe"
              sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
              size   = (Get-Item $path).Length
            }
          }
          [ordered]@{ version = $env:TAG; files = @($files) } | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8NoBOM out/runtime.json
          gh release upload $env:TAG out/moddedmc-server-windows-x86_64.exe out/moddedmc-agent-windows-x86_64.exe out/runtime.json --clobber
