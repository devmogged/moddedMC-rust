name: PR Labels

# Area labels from changed paths (.github/labeler.yml) and a size label from the diff.
# pull_request_target has a write token: this workflow never checks out or runs PR code. It reads
# only the file list and line counts through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label PR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          sync-labels: true

      - name: Size label
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repo,
              pull_number: pr.number,
              per_page: 100,
            });
            // Lockfiles and generated patches say little about review effort.
            const counted = files.filter((f) => !/(^|\/)Cargo\.lock$/.test(f.filename));
            const lines = counted.reduce((n, f) => n + f.additions + f.deletions, 0);
            const sizes = [[1000, "XXL"], [500, "XL"], [100, "L"], [30, "M"], [10, "S"], [0, "XS"]];
            const want = `size:${sizes.find(([min]) => lines >= min)[1]}`;
            const current = pr.labels.map((l) => l.name);
            for (const name of current.filter((n) => n.startsWith("size:") && n !== want)) {
              await github.rest.issues.removeLabel({ ...repo, issue_number: pr.number, name });
            }
            if (!current.includes(want)) {
              await github.rest.issues.addLabels({ ...repo, issue_number: pr.number, labels: [want] });
            }
            core.info(`${lines} changed lines -> ${want}`);
